//        file = fabricFile
//        displayName = fabricName
//        projectId = "WROfLLvn"
//        accessToken = TOKENS.get("MODRINTH_PUBLISH_TOKEN")
//        minecraftVersions.add(minecraft_version)
//        announcementTitle = "Modrinth download for $fabricEmoji"
//        modLoaders.add("fabric")
//        requires("create-fabric", "fabric-api")
//    }

    println("DISCORD MESSAGE:\n\n$newVersionPing\n# Create: Trading Floor has been updated to $project.version for $minecraft_version ($forgeEmoji" + /* "/ $fabricEmoji\" +*/ ")\n " + changelogText)

